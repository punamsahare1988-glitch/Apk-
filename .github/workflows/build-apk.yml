name: Build & Release APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:
  release:
    types: [ created, published ]

permissions:
  contents: write

jobs:
  build:
    name: Build and Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
          fi

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Organize APK Files
        run: |
          mkdir -p build-apks
          APK_SRC=$(find app/build/outputs/apk -name "*debug.apk" | head -n 1)
          if [ -f "$APK_SRC" ]; then
            cp "$APK_SRC" build-apks/ScreenHost-v1.0-debug.apk
            cp "$APK_SRC" build-apks/ScreenHost.apk
          else
            echo "Error: APK not found!"
            exit 1
          fi

      - name: Upload Full APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenHost-APK-Full
          path: build-apks/*.apk
          retention-days: 90

      - name: Auto-Create GitHub Release with APK (on tag or manual trigger)
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'push'
        with:
          tag_name: ${{ github.ref_name }}
          name: "ScreenHost Release ${{ github.ref_name }}"
          draft: false
          prerelease: false
          files: |
            build-apks/ScreenHost.apk
            build-apks/ScreenHost-v1.0-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
