name: Build & Release APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Collect and Rename APK
        run: |
          mkdir -p build-apks
          APK_FILE=$(find app/build/outputs/apk -name "*.apk" -type f | head -n 1)
          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            echo "Found APK at: $APK_FILE"
            cp "$APK_FILE" build-apks/ScreenHost.apk
            cp "$APK_FILE" build-apks/ScreenHost-debug.apk
            ls -lh build-apks/
          else
            echo "::error::No APK file was generated."
            exit 1
          fi

      - name: Upload Full APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenHost-APK-Full
          path: build-apks/*.apk
          retention-days: 90

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Release {0}', github.ref_name) || format('ScreenHost Build v1.0.{0}', github.run_number) }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            build-apks/ScreenHost.apk
            build-apks/ScreenHost-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
